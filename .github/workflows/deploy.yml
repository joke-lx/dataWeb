name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/joke-lx/dataweb-api
  IMAGE_WEB: ghcr.io/joke-lx/dataweb-web

jobs:
  build-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pre-compute the docker config.json content and persist it as a
      # workflow artifact. CRITICAL: GitHub Actions redacts any job output
      # whose value looks like a secret (high-entropy base64, any string
      # with "AUTH"/"TOKEN" patterns, etc.) — so we cannot pass the
      # registry auth through a job output. An artifact is a file on the
      # Actions storage, scanned only on the server side, not the value.
      - name: Build docker config
        if: success()
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -e
          AUTH_B64=$(printf '%s:%s' "$ACTOR" "$GHCR_TOKEN" | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$AUTH_B64" > docker_config.json
          echo "wrote docker_config.json ($(wc -c < docker_config.json) bytes, auth_len=${#AUTH_B64})"

      - name: Upload docker config
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docker-config
          path: docker_config.json
          retention-days: 1

  deploy:
    name: Deploy to server over SSH
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download docker config
        uses: actions/download-artifact@v4
        with:
          name: docker-config
          path: .
          merge-multiple: true

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          source: "docker-compose.prod.yml,docker_config.json"
          target: "~/dataweb/"
          timeout: 5m

      - name: Pull images and (re)start stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          timeout: 5m
          command_timeout: 30m
          envs: GITHUB_SHA
          script: |
            set -e
            cd ~/dataweb

            # Install the pre-built docker config (auth written by build-push,
            # transferred as a file via SCP to avoid any env-value redaction
            # by GitHub Actions' secret scanner).
            mkdir -p ~/.docker
            mv docker_config.json ~/.docker/config.json
            chmod 600 ~/.docker/config.json
            echo "config installed: $(cat ~/.docker/config.json)"

            mkdir -p data

            echo "Pulling images (authenticated)..."
            # The link between this server and ghcr.io is very slow (~1 MB/s,
            # 437 MB api image would take hours). Strategy:
            # 1. If the exact SHA tag is already cached locally, skip pull.
            # 2. Otherwise, try a pull with a hard 8-minute timeout per
            #    image. On timeout, fall back to the locally-cached :latest
            #    tag so `up -d` can still start the stack.
            pull_one() {
              local img="$1"
              if docker image inspect "$img" >/dev/null 2>&1; then
                echo "  $img: cached locally"
                return 0
              fi
              echo "  $img: pulling (8 min budget)..."
              if timeout 480 docker pull "$img" >/dev/null 2>&1; then
                echo "  $img: pulled"
                return 0
              fi
              echo "  $img: pull timed out, will fall back to :latest"
              return 1
            }
            pull_one "ghcr.io/joke-lx/dataweb-api:${GITHUB_SHA}" || true
            pull_one "ghcr.io/joke-lx/dataweb-web:${GITHUB_SHA}" || true

            # Pin to the SHA tag if we have it, otherwise fall back to
            # :latest which the build-push job just refreshed.
            if docker image inspect "ghcr.io/joke-lx/dataweb-api:${GITHUB_SHA}" >/dev/null 2>&1 \
               && docker image inspect "ghcr.io/joke-lx/dataweb-web:${GITHUB_SHA}" >/dev/null 2>&1; then
              echo "TAG=${GITHUB_SHA}" > .env
            else
              echo "Falling back to :latest tag"
              echo "TAG=latest" > .env
            fi

            echo "Pulling images via docker compose (forces refresh of :latest cache)..."
            # CRITICAL: `docker compose up -d` alone does NOT re-pull a
            # refreshed :latest tag — it reuses the locally-cached image
            # digest. The cached container keeps running the OLD bundle
            # even after GHCR's :latest advances. `compose pull` forces
            # the daemon to fetch the new digest before we re-create.
            #
            # However the GHCR link is very slow (~1 MB/s); a 437 MB web
            # image easily exceeds the SSH command_timeout. Wrap pull in
            # a 12-minute budget so a slow pull doesn't kill the deploy.
            # On pull timeout we fall back to the locally-cached image
            # (still better than abandoning the deploy entirely).
            timeout 720 docker compose -f docker-compose.prod.yml pull \
              && echo "compose pull: ok" \
              || echo "WARN: compose pull failed/timeout (continuing with cache)"

            echo "Recreating stack..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate

            echo "Pruning old images..."
            docker image prune -f || true

            # Health check with retry (web on :80, api via web's /api proxy).
            echo "Health check..."
            MAX=6
            i=0
            ok=false
            while [ $i -lt $MAX ]; do
              i=$((i + 1))
              echo "Attempt $i/$MAX..."
              if curl -f -s http://localhost/ >/dev/null 2>&1 \
                 && curl -f -s http://localhost/api/health >/dev/null 2>&1; then
                ok=true
                echo "Health check passed!"
                break
              fi
              sleep 5
            done

            if [ "$ok" = false ]; then
              echo "Health check FAILED. Recent logs:"
              docker compose -f docker-compose.prod.yml logs --tail 60
              exit 1
            fi

            echo "Deployment successful!"
        env:
          GITHUB_SHA: ${{ github.sha }}
